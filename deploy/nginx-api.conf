# nginx server block for awad-backend, to sit alongside the existing app.
#
# Install:
#   sudo cp deploy/nginx-api.conf /etc/nginx/sites-available/awad-backend
#   sudo ln -s /etc/nginx/sites-available/awad-backend /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.awadali.com
#
# certbot rewrites this file to add the TLS block and a :80 -> :443 redirect.

server {
    listen 80;
    listen [::]:80;
    server_name api.awadali.com;

    # Uploads here are small JSON bodies; cap them well below the default 1m
    # so a stray large POST is rejected at the edge rather than in Node.
    client_max_body_size 256k;

    # The Razorpay webhook signature is an HMAC over the exact bytes sent, so
    # nothing may rewrite or re-encode the body on the way through.
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        'upgrade';

        proxy_read_timeout 60s;
        proxy_redirect off;
    }
}
